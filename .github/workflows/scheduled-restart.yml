name: Scheduled Container Restart

on:
  schedule:
    # Once a week: Sunday 00:00 US Eastern.
    # GitHub cron is UTC-only (no DST), so this is pinned to 05:00 UTC =
    # midnight EST (01:00 ET during EDT).
    - cron: '0 5 * * 0'
  workflow_dispatch:  # Allow manual trigger

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.PEPTILINECONTAINER_AZURE_CREDENTIALS }}

      - name: Restart Container App
        run: |
          set -euo pipefail
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          REVISION=$(az containerapp revision list \
            --name peptilinecontainer \
            --resource-group COH_MBPDB_RG \
            --query "[?properties.active].name | [0]" -o tsv --only-show-errors)
          if [ -z "$REVISION" ]; then
            echo "No active revision found for peptilinecontainer" >&2
            exit 1
          fi
          echo "Restarting active revision: $REVISION"
          az containerapp revision restart \
            --name peptilinecontainer \
            --resource-group COH_MBPDB_RG \
            --revision "$REVISION" \
            --only-show-errors
